# KrakenPaperBot : un cycle de simulation toutes les 30 min, journaux committés dans KrakenPaperBot/data/.
# Claude lit ces journaux toutes les 2 h pour son analyse (routine Claude Code, 20 min après).
#
# Le cron GitHub n'est pas fiable pour ce dépôt : plus de 2h sans un seul déclenchement automatique
# (25/09, malgré des commits fréquents dans l'intervalle) avant qu'une surveillance Claude ne le
# déclenche à la main via workflow_dispatch. C'est ce déclenchement manuel, en routine toutes les
# ~45-60 min, qui assure la cadence réelle tant que le cron GitHub ne se stabilise pas.
name: KrakenPaperBot

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kraken-paper-bot
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: KrakenPaperBot
    env:
      KPB_DATA_DIR: data
      TZ: Europe/Brussels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py run && python bot.py export
      - name: Enregistrer les journaux
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898728+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          git commit -q -m "KrakenPaperBot: cycle $(date '+%d/%m %H:%M')"
          for i in 1 2 3 4; do
            git pull -q --rebase origin "$GITHUB_REF_NAME" && git push -q origin "HEAD:$GITHUB_REF_NAME" && exit 0
            sleep $((2 ** i))
          done
          exit 1
